name: PHP Application Check

on:
  push:
    branches: [main]

jobs:
  php-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          php -v
          for file in *.php; do
            php -l "$file"
          done
